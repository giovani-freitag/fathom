name: image

# Built when a release is cut, so a tag and an image always name the same code.
# Asked for by the release workflow rather than by the release itself, which
# GitHub will not do for an event its own token created. `workflow_dispatch`
# stays for the same reason the demo has one: something that can only be rebuilt
# by cutting a release is something nobody rebuilds.
on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag the release named, not whatever main has drifted to since.
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` and the version, so a compose file can name either: one to
      # follow releases, one to pin.
      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # No layer cache. It was kept on the reasoning that a runner is thrown
      # away and the dependency install is most of the build, and the second
      # half of that turned out to be false: measured on a release, the two
      # `npm ci` steps are 21.7s of a 99s job and writing the cache back costs
      # 15.8s of that every time — six seconds of net saving, and none at all
      # on the builds that change a lockfile. What it did cost was a third
      # package in the registry that reads like an image and is not one.
      # The part: the two processes and nothing else, for a compose file that
      # brings its own database. Tagged `slim` so the plain tag is free for the
      # one below.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:slim
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}-slim

      # The whole thing in one container, and the tag somebody types without
      # reading. `docker run` on it is a chart, which is the only way a reader
      # who has not decided to like this yet will ever see one.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}

      # The compose file goes to the registry too, as an OCI artifact, so that
      # running this is one docker command and nothing to download by hand:
      #
      #   docker compose -f oci://ghcr.io/<owner>/<repo>/compose:latest up -d
      #
      # After the image, because publishing resolves what the file references
      # and a compose pointing at an image that is not there yet fails.
      # `--with-env` because the services declare variables and publish will not
      # send them unasked. What it sends is what this runner resolves, and a
      # runner has no `.env`: the defaults written in the file, which is what
      # the command in the README is meant to bring up.
      #
      # `--yes` because publishing the declared variables is a question it asks
      # out loud, and a runner has no one to ask: unanswered it reads as no,
      # publishes nothing, and does not fail — so the artifact the first command
      # in the README depends on quietly never existed.
      - run: |
          docker compose publish --yes --with-env \
            ghcr.io/${{ github.repository }}/compose:latest
          docker compose publish --yes --with-env \
            ghcr.io/${{ github.repository }}/compose:${{ steps.version.outputs.value }}

      # Asked for back, because the publish above answers a question rather
      # than failing when it cannot: a step that quietly does nothing is how
      # the artifact went missing in the first place, and the command at the
      # top of the README is the only thing that notices.
      - name: Check the compose artifact is really there
        run: |
          for tag in latest ${{ steps.version.outputs.value }}; do
            docker compose -f "oci://ghcr.io/${{ github.repository }}/compose:$tag" config >/dev/null
            printf 'compose:%s reads back\n' "$tag"
          done
