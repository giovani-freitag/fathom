name: pr title

# Squashing takes the pull request title as the commit subject whenever the
# branch carries more than one commit, and release-please reads that subject
# and nothing else — the conventional commits listed in the body are not looked
# at. A title written as prose parses as nothing, the release it should have cut
# is skipped without failing anything, and the work sits on main until some
# later commit happens to arrive with a prefix. That has happened to three pull
# requests so far, which is what this refuses.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Retitling a pull request is done by trying a few, and only the last one is
# the one being asked about.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The same set the commits already use. A scope stays optional: this
          # repository has never needed one to say what a change touches.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          # A subject is a sentence rather than a heading, and it is the line
          # the changelog will print, so it reads as one: lowercase, and no full
          # stop at the end of something that was never a paragraph.
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >-
            The subject "{subject}" has to begin in lowercase and end without a
            full stop, the way the commits in this repository are written.
