name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push has nothing worth finishing: the branch it checked no
# longer exists in the form it was checking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Written to only by the badge step, and only on the default branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The floor lives in vitest.config.ts, so it is the same number whether
      # the suite is run here or by hand.
      - name: Test and measure coverage
        run: npm run test:coverage

      - name: Report coverage
        if: always()
        run: node scripts/report-coverage.mjs >> "$GITHUB_STEP_SUMMARY"

      # Only from the branch the badge speaks for: a pull request measuring its
      # own coverage must not overwrite what the README claims about main.
      #
      # Written through the contents API rather than by cloning: the commit is
      # made on the server, so there is no second checkout to keep in step and
      # nothing to authenticate beyond the token the job already holds.
      - name: Publish the coverage badge
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { readFile } = require('node:fs/promises');
            const path = 'coverage.json';
            const branch = 'badges';
            const content = await readFile('coverage/badge.json', 'utf8');

            const published = await github.rest.repos.getContent({
              ...context.repo, path, ref: branch,
            }).catch((error) => {
              if (error.status !== 404) throw error;
              return null;
            });

            if (published !== null
              && Buffer.from(published.data.content, 'base64').toString() === content) {
              core.info('Coverage unchanged; nothing published.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              branch,
              message: 'chore: update the coverage badge',
              content: Buffer.from(content).toString('base64'),
              ...(published === null ? {} : { sha: published.data.sha }),
            });
            core.info(`Published ${content.replace(/\s+/g, ' ').trim()}`);

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the served bundle
        run: npm run build
      - name: Build the demo bundle
        run: npm run build:demo
