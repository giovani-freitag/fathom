name: release

on:
  push:
    branches: [main]

# A release opens a pull request and later tags a commit; two of those racing
# would tag the same version twice.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Reads the conventional-commit subjects since the last tag, keeps a
      # release pull request up to date with the version and changelog they
      # imply, and tags the commit when that request is merged.
      #
      # Configured through files rather than the `release-type` input because
      # `bump-minor-pre-major` lives only there: while this is under 1.0.0, a
      # breaking change is a minor bump, which is what the version was started
      # at 0.x to mean.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A release published with GITHUB_TOKEN does not start another workflow —
      # GitHub refuses to let a run trigger a run. `repository_dispatch` is the
      # one event exempt from that, which is why the deploy is asked for rather
      # than left to notice the release on its own.
      - if: steps.release.outputs.release_created == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: release-published
          client-payload: '{"ref": "${{ steps.release.outputs.tag_name }}"}'

      # Measured against the commit that was just tagged, so the badge in the
      # README describes the code someone can actually download rather than
      # whatever main happens to be in the middle of.
      - if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.release.outputs.release_created == 'true'
        run: npm ci
      - if: steps.release.outputs.release_created == 'true'
        run: npm run test:coverage

      - if: steps.release.outputs.release_created == 'true'
        name: Record the coverage of the release
        uses: actions/github-script@v7
        with:
          script: |
            const { readFile } = require('node:fs/promises');
            const path = '.github/badges/coverage.json';
            const content = await readFile('coverage/badge.json', 'utf8');

            const published = await github.rest.repos.getContent({ ...context.repo, path })
              .catch((error) => {
                if (error.status !== 404) throw error;
                return null;
              });

            if (published !== null
              && Buffer.from(published.data.content, 'base64').toString() === content) {
              core.info('Coverage unchanged since the last release.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              message: `chore: record the coverage of ${{ steps.release.outputs.tag_name }}`,
              content: Buffer.from(content).toString('base64'),
              ...(published === null ? {} : { sha: published.data.sha }),
            });
