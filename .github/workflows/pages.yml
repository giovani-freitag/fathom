name: demo

# Published when a release is cut rather than on every push, so the page and a
# tag always name the same code. Asked for by the release workflow rather than
# triggered by the release itself, which GitHub will not do for an event its own
# token created. `workflow_dispatch` stays, because a demo that can only be
# refreshed by cutting a release is a demo nobody refreshes.
on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

# One deployment at a time, and never cancel one halfway: a partial publish
# leaves the page serving a script bundle its HTML does not reference.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag the release named, not whatever main has drifted to since.
          ref: ${{ github.event.client_payload.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build:demo
      # The guide goes out under the demo, so one Pages site carries both and a
      # link from the chart to the docs never leaves the origin it was served
      # from.
      - run: npm run build:guide
      - run: mv docs/.vitepress/dist dist/demo/guide
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
