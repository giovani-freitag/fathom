<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#f2f6fa" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#05080c" media="(prefers-color-scheme: dark)" />
        <meta name="color-scheme" content="light dark" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <title>Fathom — live order book liquidity</title>
        <meta
            name="description"
            content="The whole order book drawn as a heat map: every resting bid and ask, second by second, recorded by the page you are reading it on."
        />

        <!-- What a pasted link becomes. Absolute, because a crawler resolves
             nothing: a relative image is a card with a hole where the picture
             goes. The address is the published one whatever this was built on,
             since it is only ever read from there. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Fathom" />
        <meta property="og:title" content="Fathom — live order book liquidity" />
        <meta
            property="og:description"
            content="The whole order book drawn as a heat map: every resting bid and ask, second by second, recorded by the page you are reading it on."
        />
        <meta property="og:url" content="https://giovani-freitag.github.io/fathom/" />
        <meta
            property="og:image"
            content="https://giovani-freitag.github.io/fathom/social-card.png"
        />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="A liquidity heat map of the Bitcoin order book, resting size drawn as colour over price and time." />

        <!-- The wide card rather than the thumbnail: the picture is the point,
             and at thumbnail size a heat map is a grey square. -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Fathom — live order book liquidity" />
        <meta
            name="twitter:description"
            content="The whole order book drawn as a heat map: every resting bid and ask, second by second, recorded by the page you are reading it on."
        />
        <meta
            name="twitter:image"
            content="https://giovani-freitag.github.io/fathom/social-card.png"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080c'/%3E%3Cpath d='M4 20h4v4H4zM10 14h4v10h-4zM16 8h4v16h-4zM22 16h4v8h-4z' fill='%2335e0c4'/%3E%3C/svg%3E" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="../src/app/demo-main.tsx"></script>
    </body>
</html>
