services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: fathom-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: fathom
      POSTGRES_USER: fathom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fathom-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fathom -d fathom"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_wal_size=4GB
      - -c
      - synchronous_commit=off

  # Both halves behind a profile, so `docker compose up -d` on its own still
  # brings up the database and nothing else — which is what somebody working on
  # the source wants, with the two processes running from their own checkout.
  #
  #   docker compose --profile full up -d
  #
  collector:
    profiles: ["full"]
    image: ${FATHOM_IMAGE:-ghcr.io/giovani-freitag/fathom:latest}
    build: .
    container_name: fathom-collector
    restart: unless-stopped
    command: ["node", "dist/workers/collector.js"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      # Inside the network the database answers on its own name and its own
      # port, whatever it was published as on the host.
      DATABASE_URL: postgres://fathom:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/fathom
      INSTRUMENT_SYMBOL: ${INSTRUMENT_SYMBOL:-BTCUSDT}
      PRICE_BUCKET_SIZE: ${PRICE_BUCKET_SIZE:-10}
      FRAME_INTERVAL_MS: ${FRAME_INTERVAL_MS:-1000}
      RECORDED_PRICE_RANGE_RATIO: ${RECORDED_PRICE_RANGE_RATIO:-0.02}
      RETAINED_PRICE_RANGE_RATIO: ${RETAINED_PRICE_RANGE_RATIO:-0.10}
      DEEP_REPAIR_INTERVAL_MS: ${DEEP_REPAIR_INTERVAL_MS:-300000}

  gateway:
    profiles: ["full"]
    image: ${FATHOM_IMAGE:-ghcr.io/giovani-freitag/fathom:latest}
    build: .
    container_name: fathom-gateway
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8787}:8787"
    environment:
      DATABASE_URL: postgres://fathom:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/fathom
      # Every address inside the container: what reaches it is decided by the
      # port mapping above, not by what the process is willing to listen on.
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8787
      VIEWER_DIST_PATH: dist/app
      FATHOM_ACCESS_TOKEN: ${FATHOM_ACCESS_TOKEN:-}
      FATHOM_TUNNELLED: ${FATHOM_TUNNELLED:-false}

volumes:
  fathom-data:
